name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Check Python syntax and whitespace
        run: |
          python3 -m compileall -q scripts
          git diff --check "$(git hash-object -t tree -w /dev/null)" HEAD

  build:
    name: Test and package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check toolchain and architecture
        run: |
          xcodebuild -version
          swift --version
          test "$(uname -m)" = "$EXPECTED_ARCH"
      - name: Cache Swift packages and build products
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: swiftpm-v1-${{ runner.os }}-${{ runner.arch }}-xcode16.4-${{ hashFiles('Package.resolved', 'Package.swift', 'Vendor/KeyboardShortcuts/Package.swift') }}
      - name: Resolve pinned dependencies
        run: |
          swift package resolve
          git diff --exit-code -- Package.resolved
      - name: Run Swift tests
        run: swift test --disable-automatic-resolution
      - name: Build and verify release application
        run: python3 scripts/build-app.py --output "$RUNNER_TEMP/package/Cliprill.app"
      - name: Exercise packaged MCP and app restart
        run: python3 scripts/smoke-mcp.py "$RUNNER_TEMP/package/Cliprill.app"
      - name: Archive verified application
        run: |
          git diff --exit-code -- Package.resolved ThirdPartyNotices
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$RUNNER_TEMP/package/Cliprill.app/Contents/Info.plist")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          mkdir -p dist
          archive="dist/Cliprill-$version-macOS-$EXPECTED_ARCH.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/package/Cliprill.app" "$archive"
          unzip -tq "$archive"
      - name: Upload verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Cliprill-macOS-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  required:
    name: CI
    if: ${{ always() }}
    needs: [repository, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$BUILD_RESULT" = success
